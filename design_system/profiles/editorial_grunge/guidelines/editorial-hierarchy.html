<!-- @dsCard group="Editorial" viewport="700x330" name="Editorial Hierarchy" subtitle="Serif authority, teletype metadata, and highlighter accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      margin: 0;
      background: var(--surface-ground, #101216);
      color: var(--text-primary, #f5f4ef);
      padding: 24px;
      font-family: var(--font-body, sans-serif);
      box-sizing: border-box;
    }
    .eyebrow {
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--color-accent, #eab308);
      margin-bottom: 8px;
    }
    .headline {
      font-family: var(--font-headline, Georgia, serif);
      font-size: 28px;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .highlight {
      background: rgba(234, 179, 8, 0.25);
      border-bottom: 2px solid var(--color-accent, #eab308);
      padding: 0 4px;
    }
    .body {
      font-size: 13px;
      color: var(--text-secondary, #b5b3aa);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="eyebrow">INVESTIGATIVE / POLICY</div>
  <div class="headline">
    The system did not fail by accident; it was <span class="highlight">designed to extract</span>.
  </div>
  <div class="body">
    Authoritative editorial serif headlines communicate gravity and analytical discipline.
    Teletype tags preserve archival authenticity without descending into novelty styling.
  </div>
</body>
</html>
