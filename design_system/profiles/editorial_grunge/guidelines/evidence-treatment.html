<!-- @dsCard group="Editorial" viewport="700x330" name="Evidence Treatment" subtitle="Archival document framing, yellow highlighter, and official stamps" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      margin: 0;
      background: var(--surface-ground, #101216);
      color: var(--text-primary, #f5f4ef);
      padding: 24px;
      font-family: var(--font-body, sans-serif);
      box-sizing: border-box;
    }
    .card {
      background: var(--surface-card, #181b20);
      border: 1px solid var(--border-subtle, rgba(245,244,239,0.26));
      border-left: 4px solid var(--color-accent, #eab308);
      padding: 16px;
      border-radius: 2px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      color: var(--text-secondary, #b5b3aa);
      margin-bottom: 8px;
    }
    .title {
      font-size: 16px;
      font-weight: bold;
      color: var(--text-primary, #f5f4ef);
      margin-bottom: 6px;
    }
    .ref {
      font-family: var(--font-mono, monospace);
      font-size: 10px;
      color: var(--text-muted, #79776f);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span>[DOCUMENT] SEC FILING 10-K • Q3 2024</span>
      <span style="color:var(--color-stamp-red, #dc2626); font-weight:bold;">[EXHIBIT A]</span>
    </div>
    <div class="title">Disclosed compensation exceeded total reported operating margin.</div>
    <div class="ref">REF: sec.gov/edgar/data/00018492/q3-filing</div>
  </div>
</body>
</html>
