<!-- @dsCard group="Punk" viewport="700x330" name="High-Contrast Accents" subtitle="Acid lime, punch pink, and stark photocopy white" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      margin: 0;
      background: var(--surface-ground, #0a0a0c);
      color: var(--text-primary, #f8fafc);
      padding: 24px;
      font-family: var(--font-body, sans-serif);
      box-sizing: border-box;
    }
    .swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .swatch {
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .swatch-name {
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      font-weight: bold;
    }
    .swatch-hex {
      font-family: var(--font-mono, monospace);
      font-size: 10px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div style="font-size:16px; font-weight:bold; color:var(--text-primary, #f8fafc);">
    Controlled Acid Palette
  </div>
  <div style="font-size:12px; color:var(--text-secondary, #94a3b8); margin-top:4px;">
    Use electric accents purposefully for key punchlines and critical terms, not random visual scatter.
  </div>
  <div class="swatches">
    <div class="swatch" style="background:#ccff00; color:#000000;">
      <span class="swatch-name">ACID LIME</span>
      <span class="swatch-hex">#CCFF00 (Accent)</span>
    </div>
    <div class="swatch" style="background:#ff2a6d; color:#ffffff;">
      <span class="swatch-name">PUNCH PINK</span>
      <span class="swatch-hex">#FF2A6D (Critical)</span>
    </div>
    <div class="swatch" style="background:#ff6b00; color:#ffffff;">
      <span class="swatch-name">CAUTION ORANGE</span>
      <span class="swatch-hex">#FF6B00 (Warning)</span>
    </div>
  </div>
</body>
</html>
