<!-- @dsCard group="Punk" viewport="700x330" name="Paste-up Logic" subtitle="Street poster typography, hard-edged containers, and disciplined accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body {
      margin: 0;
      background: var(--surface-ground, #0a0a0c);
      color: var(--text-primary, #f8fafc);
      padding: 24px;
      font-family: var(--font-body, sans-serif);
      box-sizing: border-box;
    }
    .badge {
      display: inline-block;
      background: var(--color-accent, #ccff00);
      color: #000000;
      font-family: var(--font-mono, monospace);
      font-weight: 900;
      font-size: 12px;
      padding: 4px 8px;
      transform: rotate(-1deg);
      margin-bottom: 12px;
      letter-spacing: 0.12em;
    }
    .poster-title {
      font-family: var(--font-headline, Impact, sans-serif);
      font-size: 38px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.05;
      margin-bottom: 12px;
    }
    .poster-box {
      border: 2px solid var(--text-primary, #f8fafc);
      box-shadow: 4px 4px 0px #000000;
      padding: 12px;
      background: var(--surface-card, #141417);
      font-size: 13px;
      color: var(--text-secondary, #94a3b8);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="badge">STREET LOGIC</div>
  <div class="poster-title">
    NOBODY IS IMMUNE TO <span style="color:var(--color-accent, #ccff00);">BULLSHIT</span>.
  </div>
  <div class="poster-box">
    Paste-up logic combines dense, woodcut-weight headlines with hard drop shadows.
    Visual punch commands immediate attention while preserving uncompromising argument structure.
  </div>
</body>
</html>
